ding-left:28px}.hero-stat strong{display:block;font-size:17px;font-weight:600;margin-top:10px;font-variant-numeric:tabular-nums}.hero-stat span{font-size:11px;color:var(--muted)}.chart-panel{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 20px #182c3b03;overflow:hidden}.chart-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid #eef1f3}.toolbar-title{font-weight:650;font-size:13px}.toolbar-title small{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:5px}.chips{display:flex;gap:3px;background:#f2f5f6;border-radius:8px;padding:4px}.chip{border:0;background:transparent;color:#71808a;border-radius:5px;padding:6px 10px;font-size:11px;cursor:pointer}.chip:hover{background:#e6edef}.chip.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #20333e15;font-weight:700}#chart-wrap{position:relative;padding:4px 10px 0}#value-box{min-height:37px;margin:6px 14px 0;padding:9px 0;font-size:11px;line-height:1.7;color:#647680;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}#value-box b{font-size:10px;color:#84919a;font-weight:500}#value-box br{display:none}#plotly-div .hoverlayer .hovertext{display:none!important}.chart-footer{border-top:1px solid #eef1f3;padding:12px 22px;display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;flex-wrap:wrap}.src-note{margin-top:18px;color:#87939b;font-size:10px;line-height:1.9}.src-note summary{font-size:11px;display:inline-block;color:#61737e}.src-note p{max-width:1000px}.src-note a{color:var(--accent)}.status:empty{display:none}.status.err,.status.warn{padding:12px;border-radius:8px;margin-bottom:16px;background:#fff2ef;color:#a64d3d}.date-grid{display:grid;grid-template-columns:1fr;gap:4px}input[type=date],select{width:100%;border:1px solid var(--border);border-radius:7px;background:#fafbfc;color:#455864;padding:8px;font-size:11px}label.chk,label.rdo{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;font-size:12px;line-height:1.5}label input{margin:0;flex-shrink:0;width:14px;height:14px}input[type=range]{width:100%;margin:13px 0 0;height:4px}.slider-val{color:var(--accent);font-weight:700;float:right}.ind-item{border:1px solid transparent;border-bottom-color:#edf1f3;padding:5px 8px;border-radius:7px;margin:3px -8px}.ind-item:has(input[data-ind]:checked){background:#f1f7f7;border-color:#e2eeee}.ind-opts{display:none;gap:5px;padding:3px 0 8px 22px;align-items:center}.ind-item:has(input[data-ind]:checked) .ind-opts{display:flex}.ind-opts input[type=color]{width:25px;height:25px;padding:2px;border:1px solid #d8e3e6;background:white;border-radius:5px}.ind-opts input[type=number]{width:44px;font-size:10px;padding:5px 3px;border:1px solid #d8e3e6;border-radius:5px}.ind-opts select{flex:1;min-width:0;padding:5px 3px;font-size:10px}.settings-details{border-top:1px solid var(--border);margin-top:22px;padding-top:18px}.settings-details summary{font-size:12px;font-weight:600;list-style:none;display:flex;justify-content:space-between}.settings-details summary:after{content:'+';color:#7c8d96}.settings-details[open] summary:after{content:'−'}.settings-details .sb-div{display:none}.settings-details .sb-h{margin-top:14px}.reset-btn{background:white;border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:11px;color:#647780;width:100%;margin-top:24px}.reset-btn:hover{background:#f3f7f8}.hamburger{display:none}.overlay{display:none}.delta-up{color:#bf6350}.delta-down{color:#467cba}.delta-neu{color:var(--muted)}.modebar{opacity:0.7}.modebar-btn{padding:4px!important}

label.chk,label.rdo{padding:5px 0}.ind-item{padding:2px 8px;margin:1px -8px}.ind-opts{padding:2px 0 5px 22px}input[type=range]{margin:8px 0 2px}.reset-btn{margin-top:12px;padding:7px 10px}
@media(max-width:860px){.content{padding:48px 8px 8px}.sidebar{padding:16px 18px}.hamburger{top:8px;right:10px;padding:7px 10px}.chart-toolbar{padding:8px 10px;gap:7px}.chips{padding:3px}.chip{padding:5px 7px}#chart-wrap{padding:0}#value-box{margin:2px 10px 0;padding:3px 0}.chart-footer{padding:6px 10px}.chart-footer>span:last-child{display:none}}

.info-btn:hover,.info-btn:focus-visible{color:#126b7b;border-color:#126b7b;background:#edf5f6}
.fin-index{margin-top:8px}.fin-index>summary{font-size:11px;color:#546b76;padding:5px 0}.fin-index .ind-item{margin-left:0;margin-right:0}.ind-heading{display:flex;align-items:center;gap:4px}.ind-heading>label{flex:1;min-width:0}.ind-item.unavailable label{color:#9aa7ae}.availability{font-size:9px;color:#89989f;margin-left:3px}.settings-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.settings-actions button{font-size:11px;border:1px solid var(--border);border-radius:6px;padding:7px 3px;background:#f7fafb}.settings-actions button:hover{background:#eaf3f5}#save-status{font-size:10px;color:#788b96;min-height:15px;margin-top:6px}.help-actions{display:inline-flex!important;gap:4px}
#info-dialog{border:1px solid #d9e3e8;border-radius:12px;padding:20px;max-width:480px;width:calc(100vw - 36px);color:var(--ink);box-shadow:0 20px 80px #152f3930}#info-dialog::backdrop{background:#122a3855}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog-head button{border:0;background:transparent;font-size:23px;color:#72848e}#info-text{white-space:pre-line;font-size:12px;line-height:1.9}#info-link{font-size:12px;color:var(--accent)}
</style>

<body>
<button class="hamburger" id="hamburger" aria-label="차트 설정 열기" aria-expanded="false" aria-controls="sidebar">☰ 설정</button>
<div class="app" id="app">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">∿</span><div>Macro Lens<small>v1.2.0</small></div></div>
    
    <div class="sb-h">날짜 범위 <button type="button" class="info-btn" data-help="dates" aria-label="날짜 범위 설명">i</button></div>
    <div class="date-row"><label for="start-date">시작일</label><input type="date" id="start-date"></div>
    <div class="date-row"><label for="end-date">종료일</label><input type="date" id="end-date"></div>

    <details class="settings-details"><summary>축 · 차트 스타일</summary>
    <div class="sb-h">Y축 설정</div>
    <div id="ymode-group"></div>

    <hr class="sb-div">
    <div class="sb-h">차트 타입</div>
    <div id="ctype-group"></div></details>

    <hr class="sb-div">
    <div class="sb-h">회귀 채널 <button type="button" class="info-btn" data-help="regression" aria-label="회귀 채널 설명">i</button></div>
    <label class="chk"><input type="checkbox" id="show-reg" checked> 회귀 채널 표시</label>
    <div id="reg-opts">
      <label class="chk"><input type="checkbox" id="reg-log" checked> 로그 회귀</label>
      <div class="sb-sub">표준편차 배수: <span class="slider-val" id="std-val">1.0</span></div>
      <input type="range" id="std-mult" min="0.5" max="4.0" step="0.1" value="1.0">
    </div>

    <hr class="sb-div">
    <div class="sb-h">지표 표시</div>
    <div id="ind-group"></div>
    <details class="settings-details" id="financial-section"><summary><span>재무지표 <button type="button" class="info-btn" data-help="financial" aria-label="재무지표 설명">i</button></span></summary><div id="financial-group"></div></details>

    <details class="settings-details" id="axis-section"><summary>지표별 축 배정</summary>
      <hr class="sb-div">
      <div class="sb-h">축 배정 (지표별 Y축)</div>
      <div id="axis-group"></div>
    </details>
    <details class="settings-details" id="settings-menu"><summary><span>설정 저장 <button type="button" class="info-btn" data-help="settings" aria-label="설정 저장 설명">i</button></span></summary>
      <div class="settings-actions"><button id="save-settings" type="button">지금 저장</button><button id="export-settings" type="button">파일 내보내기</button><button id="import-settings" type="button">파일 불러오기</button><button id="reset-view" type="button">기본값 복원</button></div>
      <input type="file" id="settings-file" accept=".json,application/json" hidden>
    </details><div id="save-status" role="status" aria-live="polite"></div>
  </aside>

  <main class="content">
    <div id="status"></div>
    <section class="chart-panel" aria-label="매크로 비교 차트">
    <div class="chart-toolbar"><div class="toolbar-title">가격과 매크로 지표<small id="chart-caption">나스닥 · 로그 회귀 채널</small></div><div class="chips" id="period-chips"></div></div>
    <div id="chart-wrap">
      <div id="value-box"></div>
      <div id="plotly-div" style="width:100%;"></div>
    </div>
    <div class="chart-footer"><span id="range-note"></span><span class="updated" id="updated"></span><span class="help-actions"><button type="button" class="info-btn" data-help="chart" aria-label="차트 조작 설명">i</button><button type="button" class="info-btn" data-help="sources" aria-label="데이터 출처 설명">i</button></span></div></section>
  </main>
</div>

<dialog id="info-dialog"><div class="dialog-head"><strong id="info-title"></strong><button id="close-info" type="button" aria-label="설명 닫기">×</button></div><p id="info-text"></p><a id="info-link" target="_blank" rel="noopener noreferrer" hidden>데이터 출처 열기 ↗</a></dialog>
<script>

// ══════════════════════════════════════════════════════════════════════════
// 색상 (원본과 동일)
const COLORS = {
  nasdaq:"#167d8d", m2:"#dc2626", fed:"#15803d", liquidity:"#7c3aed",
  dgs10:"#0891b2", dgs30:"#c2410c", spread:"#65a30d"
};
// 지표별 기본 스타일 (색상 / 굵기 / 선종류) — 사용자 조정 가능
const DEF_STYLE = {
  nasdaq:{color:"#167d8d", width:2, dash:"solid"},
  m2:{color:"#dc2626", width:1, dash:"dot"},
  fed:{color:"#15803d", width:1, dash:"dot"},
  liquidity:{color:"#7c3aed", width:1, dash:"dashdot"},
  dgs10:{color:"#0891b2", width:1, dash:"dot"},
  dgs30:{color:"#c2410c", width:1, dash:"dot"},
  spread:{color:"#65a30d", width:1, dash:"dashdot"}
};
function lineOf(id){ const s=S.style[id]; return {color:s.color, width:s.width, dash:s.dash}; }
// 축 선택지
const AXIS_CHOICES = ["메인(좌)","왼쪽 보조축 1","왼쪽 보조축 2","오른쪽 보조축 1",
  "오른쪽 보조축 2","오른쪽 보조축 3","오른쪽 보조축 4","오른쪽 보조축 5"];
const AXIS_KEY_OF = {"메인(좌)":"y","왼쪽 보조축 1":"y2","왼쪽 보조축 2":"y7",
  "오른쪽 보조축 1":"y3","오른쪽 보조축 2":"y4","오른쪽 보조축 3":"y5",
  "오른쪽 보조축 4":"y6","오른쪽 보조축 5":"y8"};
const AXIS_NAME_OF = {"y":"yaxis","y2":"yaxis2","y3":"yaxis3","y4":"yaxis4",
  "y5":"yaxis5","y6":"yaxis6","y7":"yaxis7","y8":"yaxis8"};
const LEFT_AXIS_KEYS=["y2","y7"], RIGHT_AXIS_KEYS=["y3","y4","y5","y6","y8"];
const AXIS_STEP=0.026;

// 지표 정의 (표시명, 기본 축 index, 기본 체크)
const INDICATORS = [
  {id:"nasdaq",   label:"나스닥",                              axLabel:"나스닥 축",        axDefault:0},
  {id:"m2",       label:"M2 (미국 통화량)",                    axLabel:"M2 축",            axDefault:1},
  {id:"fed",      label:"기준금리 (FFR)",                      axLabel:"기준금리 축",      axDefault:3},
  {id:"liquidity",label:"글로벌 유동성", axLabel:"글로벌 유동성 축", axDefault:4},
  {id:"dgs10",    label:"美 국채금리 10년물",                  axLabel:"10년물 축",        axDefault:5},
  {id:"dgs30",    label:"美 국채금리 30년물",                  axLabel:"30년물 축",        axDefault:6},
  {id:"spread",   label:"30Y−10Y 금리차",          axLabel:"금리차 축",        axDefault:7},
];
const FIN_INDEXES=[['nasdaq','나스닥 종합'],['sp500','S&P 500'],['dow','다우 산업평균']];
const FIN_METRICS=[['pe','PER · 연도별','배'],['eps','EPS · 연도별','지수 EPS'],['forward_pe','예상 PER','배'],['forward_eps','예상 EPS','지수 EPS']];
const FIN_INDICATORS=FIN_INDEXES.flatMap(([index,name])=>FIN_METRICS.map(([metric,label,unit])=>({id:'fin_'+index+'_'+metric,index,metric,label:name+' '+label,shortLabel:label,unit,axLabel:name+' '+label+' 축',axDefault:metric.includes('eps')?5:4,financial:true})));
FIN_INDICATORS.forEach(ind=>{INDICATORS.push(ind);DEF_STYLE[ind.id]={color:({nasdaq:'#8d6fba',sp500:'#bb7950',dow:'#5c799f'})[ind.index],width:1.6,dash:ind.metric.startsWith('forward')?'dot':'solid'};});
const PERIODS = ["YTD","1Y","3Y","5Y","10Y","20Y","30Y","MAX"];

let DATA = null;
const S = { period:"10Y", start:null, end:null, ymode:"다중 Y축", ctype:"Line",
  showReg:true, regLog:true, stdMult:1.0,
  show:{nasdaq:true,m2:false,fed:false,liquidity:false,dgs10:false,dgs30:false,spread:false},
  axis:{}, style:{}, dateMode:"rolling", view:{} };
S.style = JSON.parse(JSON.stringify(DEF_STYLE));
FIN_INDICATORS.forEach(ind=>S.show[ind.id]=false);
INDICATORS.forEach(ind=>S.axis[ind.id]=AXIS_KEY_OF[AXIS_CHOICES[ind.axDefault]]);
const DEFAULT_STATE=JSON.parse(JSON.stringify(S));


// ── 유틸 ──────────────────────────────────────────────────────────────────
function fmt(v, d){ if(v===null||v===undefined||isNaN(v)) return "—";
  return v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
function todayStr(){ return DATA && DATA.updated ? DATA.updated : new Date().toISOString().slice(0,10); }

function periodStart(period, endS){
  const end = new Date(endS);
  if(period==="MAX") return "1996-01-01";
  if(period==="YTD") return end.getFullYear()+"-01-01";
  const yrs={ "1Y":1,"3Y":3,"5Y":5,"10Y":10,"20Y":20,"30Y":30 }[period];
  const d=new Date(end); d.setFullYear(d.getFullYear()-yrs);
  return d.toISOString().slice(0,10);
}

// 시리즈 {dates,values} 를 [start,end] 로 필터
function filt(ser, start, end){
  if(!ser) return null;
  const ds=[], vs=[];
  for(let i=0;i<ser.dates.length;i++){
    const dt=ser.dates[i];
    if(dt>=start && dt<=end){ ds.push(dt); vs.push(ser.values[i]); }
  }
  return {dates:ds, values:vs};
}
// 나스닥 OHLC 필터
function filtND(nd, start, end){
  const o={dates:[],open:[],high:[],low:[],close:[]};
  for(let i=0;i<nd.dates.length;i++){
    const dt=nd.dates[i];
    if(dt>=start && dt<=end){
      o.dates.push(dt); o.open.push(nd.open[i]); o.high.push(nd.high[i]);
      o.low.push(nd.low[i]); o.close.push(nd.close[i]);
    }
  }
  return o;
}
// 정규화
function normalize(ser, mode){
  if(!ser) return ser;
  const v=ser.values, n=v.length;
  if(mode==="지수화 (기준=100)"){
    const base=v.find(x=>x!==null && Number.isFinite(x));
    if(!Number.isFinite(base)||base===0)return {dates:ser.dates,values:v.map(()=>null)};
    return {dates:ser.dates, values:v.map(x=>(x===null||isNaN(x))?null:x/base*100)};
  }
  if(mode==="증감률 (수익률%)"){
    const base=v.find(x=>x!==null && Number.isFinite(x));
    const out=v.map(x=>Number.isFinite(x)&&Number.isFinite(base)&&base!==0?(x/base-1)*100:null);
    return {dates:ser.dates, values:out};
  }
  return ser;
}
// 선형 최소제곱 (deg1)
function polyfit1(x,y){
  const n=x.length; let sx=0,sy=0,sxx=0,sxy=0;
  for(let i=0;i<n;i++){ sx+=x[i]; sy+=y[i]; sxx+=x[i]*x[i]; sxy+=x[i]*y[i]; }
  const slope=(n*sxy - sx*sy)/(n*sxx - sx*sx);
  const ic=(sy - slope*sx)/n;
  return [slope, ic];
}
function popStd(arr){
  const n=arr.length; let m=0; for(const a of arr) m+=a; m/=n;
  let s=0; for(const a of arr) s+=(a-m)*(a-m); return Math.sqrt(s/n);
}

function chartHeight(){
  const wrap=document.getElementById('chart-wrap');
  const box=document.getElementById('value-box');
  return Math.max(120, wrap.clientHeight - box.offsetHeight - 4);
}
function resizeChart(){
  const plot=document.getElementById('plotly-div');
  if(!plot || !plot.data || typeof Plotly==='undefined')return;
  const height=Math.round(chartHeight()),width=Math.round(plot.clientWidth);
  if(width>0 && (Math.abs((plot.layout.height||0)-height)>1 || Math.abs((plot.layout.width||0)-width)>1))
    Plotly.relayout(plot,{height,width});
}
// ── 렌더 ──────────────────────────────────────────────────────────────────
async function render(){
  if(!MacroSettings.validDate(S.start)||!MacroSettings.validDate(S.end)||S.start>S.end){document.getElementById('status').textContent='시작일과 종료일을 확인해 주세요.';return;}
  saveSettings();
  for(const id in S.style){ COLORS[id]=S.style[id].color; }
  const start=S.start, end=S.end;
  const useLog = !(S.ymode==="지수화 (기준=100)" || S.ymode==="증감률 (수익률%)");

  // 데이터 필터
  const nd  = filtND(DATA.nasdaq, start, end);
  const m2  = filt(DATA.m2, start, end);
  const fed = filt(DATA.fed, start, end);
  const d10 = filt(DATA.dgs10, start, end);
  const d30 = filt(DATA.dgs30, start, end);
  // 스프레드 30Y-10Y (날짜 교집합)
  let spread=null;
  if(d10 && d30 && d10.dates.length && d30.dates.length){
    const m={}; for(let i=0;i<d10.dates.length;i++) if(d10.values[i]!==null) m[d10.dates[i]]=d10.values[i];
    const ds=[],vs=[];
    for(let i=0;i<d30.dates.length;i++){
      const dt=d30.dates[i];
      if(d30.values[i]!==null && m[dt]!==undefined){ ds.push(dt); vs.push(d30.values[i]-m[dt]); }
    }
    if(ds.length) spread={dates:ds, values:vs};
  }
  // 글로벌 유동성: 실제 관측 날짜를 사용하고 다른 지표와 동일하게 기간 필터 적용
  const liqActual = filt(DATA.liquidity_actual, start, end);
  const liqPlot = liqActual;

  if(!nd.dates.length){
    document.getElementById('status').innerHTML='<div class="status err">선택 기간에 나스닥 데이터가 없습니다.</div>';
    return;
  }
  document.getElementById('status').innerHTML='';

  // ── 메트릭 카드 ──
  const last = {};
  let cards="";
  function card(label,val,delta){ return `<div class="metric-card"><div class="metric-label">${label}</div><div class="metric-value">${val}</div><div class="metric-delta">${delta}</div></div>`; }
  function deltaH(v,unit){ if(v===null) return '<span class="delta-neu">—</span>';
    const cls=v>0?"delta-up":(v<0?"delta-down":"delta-neu"); const ar=v>0?"▲":(v<0?"▼":"—");
    return `<span class="${cls}">${ar} ${fmt(v,2)}${unit}</span>`; }

  const ndc=nd.close;
  last.nasdaq=ndc[ndc.length-1];
  const chgNd=(ndc[ndc.length-1]/ndc[0]-1)*100;
  document.getElementById('range-note').textContent=start+' — '+end+' · '+Object.values(S.show).filter(Boolean).length+'개 지표 선택';
  document.getElementById('chart-caption').textContent=S.ymode+(S.showReg&&S.show.nasdaq?' · '+(S.regLog?'로그':'선형')+' 회귀 ±'+S.stdMult.toFixed(1)+'σ':'');
  cards+=card("나스닥 (최근)", fmt(last.nasdaq,0), deltaH(chgNd,"%")+" (기간 내)");
  if(m2&&m2.values.length){ last.m2=m2.values[m2.values.length-1];
    cards+=card("M2 (십억달러)", fmt(last.m2,0), deltaH(last.m2-m2.values[0],"B")+" (기간 내)"); }
  if(fed&&fed.values.length){ last.fed=fed.values[fed.values.length-1];
    cards+=card("기준금리 (%)", fmt(last.fed,2)+"%", deltaH(last.fed-fed.values[0],"%p")+" (기간 내)"); }
  if(d10&&d10.values.length){ last.dgs10=d10.values[d10.values.length-1];
    cards+=card("美 국채 10년물 (%)", fmt(last.dgs10,2)+"%", deltaH(last.dgs10-d10.values[0],"%p")+" (기간 내)"); }
  if(d30&&d30.values.length){ last.dgs30=d30.values[d30.values.length-1];
    cards+=card("美 국채 30년물 (%)", fmt(last.dgs30,2)+"%", deltaH(last.dgs30-d30.values[0],"%p")+" (기간 내)"); }
  if(spread&&spread.values.length){ last.spread=spread.values[spread.values.length-1];
    cards+=card("30Y-10Y 금리차 (%p)", fmt(last.spread,2)+"%p", deltaH(last.spread-spread.values[0],"%p")+" (기간 내)"); }
  if(liqActual&&liqActual.values.length){ last.liquidity=liqActual.values[liqActual.values.length-1];
    cards+=card("글로벌 유동성 YoY (%)", fmt(last.liquidity,2)+"%", '<span class="delta-neu">Fed+ECB+BOJ 합산, 시프트 없음</span>'); }

  // ── 트레이스 & 축 배정 ──
  const AX = S.ymode==="다중 Y축" ? S.axis
    : {nasdaq:"y",m2:"y",fed:"y",liquidity:"y",dgs10:"y",dgs30:"y",spread:"y"};
  FIN_INDICATORS.forEach(ind=>{if(S.ymode!=="다중 Y축")AX[ind.id]='y';});
  const traces=[];
  const activeAxis={}; // axisKey -> [{label,color}]
  function reg(k,label,color){ (activeAxis[k]=activeAxis[k]||[]).push({label,color}); }

  const candleValue=v=>S.ymode==='지수화 (기준=100)'?v/nd.close[0]*100:S.ymode==='증감률 (수익률%)'?(v/nd.close[0]-1)*100:v;
  // 나스닥
  if(S.show.nasdaq){
    const ax=AX.nasdaq;
    if(S.ctype==="Bar+Lines (봉차트)"){
      traces.push({type:"candlestick", x:nd.dates, open:nd.open.map(candleValue), high:nd.high.map(candleValue), low:nd.low.map(candleValue), close:nd.close.map(candleValue),
        increasing:{line:{color:"#dc2626"}}, decreasing:{line:{color:"#167d8d"}},
        name:"나스닥 (봉차트)", yaxis:ax, showlegend:true});
    } else {
      const nv=normalize({dates:nd.dates,values:nd.close}, S.ymode);
      traces.push({type:"scatter", mode:"lines", x:nv.dates, y:nv.values, name:"나스닥",
        line:lineOf('nasdaq'), yaxis:ax});
    }
    // 회귀 채널
    if(S.showReg){
      const nv=normalize({dates:nd.dates,values:nd.close}, S.ymode);
      const xs=[],ys=[],dts=[];
      for(let i=0;i<nv.values.length;i++){ if(nv.values[i]!==null && !isNaN(nv.values[i])){ xs.push(xs.length); ys.push(nv.values[i]); dts.push(nv.dates[i]); } }
      if(xs.length>2){
        const logFit=S.regLog && ys.every(v=>v>0);
        const fy = logFit ? ys.map(Math.log) : ys.slice();
        const [sl,ic]=polyfit1(xs,fy);
        const ctr=xs.map(x=>sl*x+ic);
        const resid=fy.map((v,i)=>v-ctr[i]);
        const std=popStd(resid);
        let cV,uV,lV;
        if(logFit){ cV=ctr.map(Math.exp); uV=ctr.map(c=>Math.exp(c+S.stdMult*std)); lV=ctr.map(c=>Math.exp(c-S.stdMult*std)); }
        else { cV=ctr.slice(); uV=ctr.map(c=>c+S.stdMult*std); lV=ctr.map(c=>c-S.stdMult*std); }
        traces.push({type:"scatter",mode:"lines",x:dts,y:cV,name:"중심 회귀선",line:{color:"#9a8461",width:1.4,dash:"dash"},yaxis:ax});
        traces.push({type:"scatter",mode:"lines",x:dts,y:uV,name:`상단 채널 (+${S.stdMult.toFixed(1)}σ)`,line:{color:"rgba(154,132,97,0.52)",width:1,dash:"dot"},yaxis:ax});
        traces.push({type:"scatter",mode:"lines",x:dts,y:lV,fill:"tonexty",fillcolor:"rgba(154,132,97,0.055)",name:`하단 채널 (-${S.stdMult.toFixed(1)}σ)`,line:{color:"rgba(154,132,97,0.52)",width:1,dash:"dot"},yaxis:ax});
      }
    }
    reg(ax,"나스닥",COLORS.nasdaq);
  }
  // M2
  if(S.show.m2 && m2 && m2.values.length){
    const v=normalize(m2,S.ymode);
    traces.push({type:"scatter",mode:"lines",x:v.dates,y:v.values,name:"M2 (십억달러)",line:lineOf('m2'),yaxis:AX.m2});
    reg(AX.m2,"M2",COLORS.m2);
  }
  // 기준금리
  if(S.show.fed && fed && fed.values.length){
    const v=normalize(fed,S.ymode);
    traces.push({type:"scatter",mode:"lines",x:v.dates,y:v.values,name:"기준금리 (FFR%)",line:lineOf('fed'),yaxis:AX.fed});
    reg(AX.fed,"기준금리",COLORS.fed);
  }
  // 글로벌 유동성
  if(S.show.liquidity && liqPlot && liqPlot.values.length){
    const v=normalize(liqPlot,S.ymode);
    traces.push({type:"scatter",mode:"lines",x:v.dates,y:v.values,name:"글로벌 유동성 프록시 (YoY%, 시프트 없음)",line:lineOf('liquidity'),yaxis:AX.liquidity});
    reg(AX.liquidity,"글로벌유동성",COLORS.liquidity);
  }
  // 10년물
  if(S.show.dgs10 && d10 && d10.values.length){
    const v=normalize(d10,S.ymode);
    traces.push({type:"scatter",mode:"lines",x:v.dates,y:v.values,name:"美 국채 10년물 (%)",line:lineOf('dgs10'),yaxis:AX.dgs10});
    reg(AX.dgs10,"美10Y",COLORS.dgs10);
  }
  // 30년물
  if(S.show.dgs30 && d30 && d30.values.length){
    const v=normalize(d30,S.ymode);
    traces.push({type:"scatter",mode:"lines",x:v.dates,y:v.values,name:"美 국채 30년물 (%)",line:lineOf('dgs30'),yaxis:AX.dgs30});
    reg(AX.dgs30,"美30Y",COLORS.dgs30);
  }
  // 금리차
  if(S.show.spread && spread && spread.values.length){
    const v=normalize(spread,S.ymode);
    traces.push({type:"scatter",mode:"lines",x:v.dates,y:v.values,name:"30Y-10Y 금리차 (%p)",line:lineOf('spread'),yaxis:AX.spread});
    reg(AX.spread,"30Y−10Y금리차",COLORS.spread);
  }

  for(const ind of FIN_INDICATORS){
    if(!S.show[ind.id])continue;
    const raw=DATA.financials?.[ind.index+'_'+ind.metric];
    const series=filt(raw,start,end);
    if(!series?.dates.length)continue;
    const v=normalize(series,S.ymode);
    traces.push({type:'scatter',mode:'lines+markers',x:v.dates,y:v.values,name:ind.label,
      line:lineOf(ind.id),marker:{size:5,color:S.style[ind.id].color},yaxis:AX[ind.id],connectgaps:false});
    reg(AX[ind.id],ind.label+' ('+ind.unit+')',S.style[ind.id].color);
  }

  // ── Y축 레이아웃 ──
  const logTarget = (useLog && S.show.nasdaq) ? AX.nasdaq : null;
  function axisTitle(k, ndOverride){
    const es=activeAxis[k]||[]; if(!es.length) return ["값","#334155"];
    const labels=es.map(e=>(e.label==="나스닥"&&ndOverride)?ndOverride:e.label);
    const color=es.length===1?es[0].color:"#334155";
    return [labels.join(" / "), color];
  }
  function axisCfg(title,color,log,side,overlaying,position,anchor){
    const cfg={ title:{text:title,font:{color:color,size:11}}, tickfont:{color:color,size:10},

      zeroline:false, linecolor:"#e5eaed" };
    if(log) cfg.type="log";
    if(overlaying){ cfg.overlaying="y"; cfg.side=side; cfg.showgrid=false; }
    if(position!==undefined && position!==null){ cfg.position=position; cfg.anchor=anchor||"free"; }
    return cfg;
  }

  const layout={ xaxis:{ title:"", showgrid:false, gridcolor:"#eef2f4", linecolor:"#e5eaed",

      spikedash:"dot", spikethickness:1, spikecolor:"#94a3b8" },
    plot_bgcolor:"#ffffff", paper_bgcolor:"#ffffff", font:{family:"Segoe UI, Malgun Gothic, sans-serif",color:"#71818b",size:11},
    legend:{ orientation:"h", yanchor:"bottom", y:1.01, xanchor:"left", x:0,
      font:{size:11,color:"#647782"}, bgcolor:"rgba(255,255,255,0)", borderwidth:0, itemclick:false, itemdoubleclick:false },
    hovermode:"x", dragmode:"zoom", margin:{l:55,r:35,t:40,b:36},
    height: chartHeight() };

  if(S.ymode==="다중 Y축"){
    const used=new Set(Object.keys(activeAxis));

    leftUsed.forEach((k,i)=>{ const pos=AXIS_STEP*1.15*(L-1-i); const [lb,cl]=axisTitle(k);
      layout[AXIS_NAME_OF[k]]=axisCfg("",cl,logTarget===k,"left",true,pos,"free");
      anns.push(mkAnn(pos,cl,lb,"right")); });
    rightUsed.forEach((k,i)=>{ const [lb,cl]=axisTitle(k);
      if(R===1){ layout[AXIS_NAME_OF[k]]=axisCfg("",cl,logTarget===k,"right",true); anns.push(mkAnn(domR,cl,lb,"left")); }
      else { const pos=1.0-AXIS_STEP*i; layout[AXIS_NAME_OF[k]]=axisCfg("",cl,logTarget===k,"right",true,pos,"free"); anns.push(mkAnn(pos,cl,lb,"left")); } });
    layout.annotations=anns;
  } else {
    const t={"동일 Y축":"지수값","지수화 (기준=100)":"지수화 (기준=100)","증감률 (수익률%)":"누적 수익률 (%)"}[S.ymode]||"지수값";
    layout.yaxis=axisCfg(t,"#334155",useLog);
    layout.xaxis.domain=[0,1];
  }

  layout.xaxis.autorange=true;
  for(const name of Object.values(AXIS_NAME_OF))if(layout[name])layout[name].autorange=true;
  layout.uirevision='view-'+S.start+'-'+S.end+'-'+S.ymode;
  if(S.view?.x){layout.xaxis.range=S.view.x.slice();layout.xaxis.autorange=false;}
  for(const key of Object.keys(S.view||{})){
    if(key==='x')continue;
    const axis=layout[AXIS_NAME_OF[key]];
    if(axis){axis.range=S.view[key].slice();axis.autorange=false;}
  }
  const plotNode=document.getElementById('plotly-div');
  if(plotNode.removeAllListeners)plotNode.removeAllListeners('plotly_relayout');
  await Plotly.react('plotly-div', traces, layout, {responsive:false, scrollZoom:false, displaylogo:false,
    displayModeBar:false, doubleClick:'reset', toImageButtonOptions:{filename:'Macro_Lens',scale:2}});

  // ── 값 박스 ──
  const dateLabel = nd.dates[nd.dates.length-1];
  const bl=[];
  function bx(cond,color,name,val){ if(cond) bl.push(`<span><span style="color:${color}">●</span> ${name}: ${val}</span>`); }
  bx(S.show.nasdaq, COLORS.nasdaq,"나스닥", fmt(last.nasdaq,0));
  bx(S.show.m2&&m2&&m2.values.length, COLORS.m2,"M2", fmt(last.m2,0));
  bx(S.show.fed&&fed&&fed.values.length, COLORS.fed,"기준금리", fmt(last.fed,2)+"%");
  bx(S.show.liquidity&&liqActual&&liqActual.values.length, COLORS.liquidity,"글로벌유동성", fmt(last.liquidity,2)+"%");
  bx(S.show.dgs10&&d10&&d10.values.length, COLORS.dgs10,"美10Y", fmt(last.dgs10,2)+"%");
  bx(S.show.dgs30&&d30&&d30.values.length, COLORS.dgs30,"美30Y", fmt(last.dgs30,2)+"%");
  bx(S.show.spread&&spread&&spread.values.length, COLORS.spread,"30Y-10Y금리차", fmt(last.spread,2)+"%p");
  for(const ind of FIN_INDICATORS){
    const entry=filt(DATA.financials?.[ind.index+'_'+ind.metric],start,end);
    if(S.show[ind.id]&&entry?.dates.length)bx(true,S.style[ind.id].color,ind.label+' ['+entry.dates.at(-1)+']',fmt(entry.values.at(-1),2));
  }
  const staticHTML = bl.length ? (`<b>${dateLabel} 기준</b><br>`+bl.join("<br>")) : "";
  const box=document.getElementById('value-box'); box.innerHTML=staticHTML;

  const pd=document.getElementById('plotly-div');
  pd.removeAllListeners && pd.removeAllListeners('plotly_hover');
  pd.removeAllListeners && pd.removeAllListeners('plotly_unhover');

  pd.removeAllListeners && pd.removeAllListeners('plotly_relayout');
  // Only update a fixed-height text strip. Never restyle traces or resize on hover.
  pd.on('plotly_hover',function(evt){
    const pts=(evt.points||[]).filter(p=>p.data.name&&!/회귀|채널/.test(p.data.name));
    if(!pts.length)return;
    const lines=pts.map(p=>{const v=Number.isFinite(p.y)?p.y:p.close;return '<span>'+escapeHTML(p.data.name)+': '+fmt(v,2)+'</span>';});
    box.innerHTML='<b>'+escapeHTML(String(pts[0].x))+'</b>'+lines.join('');
  });
  pd.on('plotly_unhover',()=>{box.innerHTML=staticHTML;});
  pd.on('plotly_relayout',event=>{
    let changed=false;
    for(const [key,name] of [['x','xaxis'],...Object.entries(AXIS_NAME_OF)]){
      if(event[name+'.autorange']===true){delete S.view[key];changed=true;}
      const a=event[name+'.range[0]'],b=event[name+'.range[1]'];
      const range=event[name+'.range']||(a!==undefined&&b!==undefined?[a,b]:null);
      if(range){S.view[key]=range;changed=true;}
    }
    if(changed)saveSettings();
  });

  document.getElementById('updated').textContent="업데이트 "+todayStr();
  requestAnimationFrame(resizeChart);
}

// ── UI 구성 ────────────────────────────────────────────────────────────────
function buildUI(){
  document.getElementById('show-reg').checked=S.showReg;
  document.getElementById('reg-log').checked=S.regLog;
  document.getElementById('std-mult').value=S.stdMult;
  document.getElementById('std-val').textContent=S.stdMult.toFixed(1);
  document.getElementById('reg-opts').style.display=S.showReg?'block':'none';
  // 기간 칩
  const pc=document.getElementById('period-chips');
  pc.innerHTML=PERIODS.map(p=>`<button type="button" class="chip${p===S.period?' active':''}" data-p="${p}">${p}</button>`).join("");
  pc.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
    S.period=el.dataset.p; S.dateMode="rolling";S.end=latestDate();S.view={};document.getElementById('end-date').value=S.end;
    pc.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.p===S.period));
    S.start=periodStart(S.period,S.end);
    document.getElementById('start-date').value=S.start;
    render();
  });
  // 날짜
  document.getElementById('start-date').value=S.start;
  document.getElementById('end-date').value=S.end;
  document.getElementById('start-date').onchange=e=>{ S.start=e.target.value; S.period=null; S.dateMode="fixed";S.view={};document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); render(); };
  document.getElementById('end-date').onchange=e=>{ S.end=e.target.value; S.period=null; S.dateMode="fixed";S.view={};document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); render(); };
  // Y축 모드
  const ym=["다중 Y축","동일 Y축","지수화 (기준=100)","증감률 (수익률%)"];
  document.getElementById('ymode-group').innerHTML=ym.map(m=>
    `<label class="rdo"><input type="radio" name="ym" value="${m}"${m===S.ymode?' checked':''}> ${m}</label>`).join("");
  document.querySelectorAll('input[name=ym]').forEach(el=>el.onchange=()=>{
    S.ymode=el.value;S.view={}; document.getElementById('axis-section').style.display=(S.ymode==="다중 Y축")?"block":"none"; render(); });
  // 차트 타입
  const ct=["Line","Bar+Lines (봉차트)"];
  document.getElementById('ctype-group').innerHTML=ct.map(c=>
    `<label class="rdo"><input type="radio" name="ct" value="${c}"${c===S.ctype?' checked':''}> ${c}</label>`).join("");
  document.querySelectorAll('input[name=ct]').forEach(el=>el.onchange=()=>{ S.ctype=el.value; render(); });
  // 회귀
  document.getElementById('show-reg').onchange=e=>{ S.showReg=e.target.checked;
    document.getElementById('reg-opts').style.display=S.showReg?"block":"none"; render(); };
  document.getElementById('reg-log').onchange=e=>{ S.regLog=e.target.checked; render(); };
  document.getElementById('std-mult').oninput=e=>{ S.stdMult=parseFloat(e.target.value);
    document.getElementById('std-val').textContent=S.stdMult.toFixed(1); render(); };
  // 지표 + 스타일 옵션 (색상 / 굵기 / 선종류)
  const DASHES=["solid","dot","dash","dashdot","longdash","longdashdot"];
  const DASH_LB={solid:"실선",dot:"점선",dash:"파선",dashdot:"일점쇄선",longdash:"긴파선",longdashdot:"긴일점쇄선"};
  const indicatorHTML=ind=>{
    const st=S.style[ind.id],entry=ind.financial?DATA.financials?.[ind.index+'_'+ind.metric]:null;
    const unavailable=ind.financial&&!entry?.dates?.length;
    const help=ind.financial?'<button type="button" class="info-btn" data-fin-help="'+ind.id+'" aria-label="'+ind.label+' 설명" title="'+ind.label+' 설명">i</button>':ind.id==='liquidity'?'<button type="button" class="info-btn" data-help="liquidity" aria-label="유동성 설명">i</button>':'';
    return `<div class="ind-item${unavailable?' unavailable':''}"><div class="ind-heading"><label class="chk"><input type="checkbox" data-ind="${ind.id}"${S.show[ind.id]?' checked':''}${unavailable?' disabled':''}> ${ind.shortLabel||ind.label}${unavailable?'<span class="availability">미제공</span>':''}</label>${help}</div><div class="ind-opts"><input type="color" data-sc="${ind.id}" value="${st.color}" title="색상"><input type="number" data-sw="${ind.id}" value="${st.width}" min="0.5" max="6" step="0.1" title="선 굵기"><select data-sd="${ind.id}" title="선 종류">${DASHES.map(d=>`<option value="${d}"${d===st.dash?' selected':''}>${DASH_LB[d]}</option>`).join('')}</select></div></div>`;
  };
  document.getElementById('ind-group').innerHTML=INDICATORS.filter(ind=>!ind.financial).map(indicatorHTML).join('');
  document.getElementById('financial-group').innerHTML=FIN_INDEXES.map(([id,label])=>'<details class="fin-index"'+(FIN_INDICATORS.some(ind=>ind.index===id&&S.show[ind.id])?' open':'')+'><summary>'+label+'</summary>'+FIN_INDICATORS.filter(ind=>ind.index===id).map(indicatorHTML).join('')+'</details>').join('');
  document.querySelectorAll('input[data-ind]').forEach(el=>el.onchange=()=>{
    S.show[el.dataset.ind]=el.checked; buildAxisSelectors(); render(); });
  document.querySelectorAll('input[data-sc]').forEach(el=>el.oninput=()=>{ S.style[el.dataset.sc].color=el.value; render(); });
  document.querySelectorAll('input[data-sw]').forEach(el=>el.onchange=()=>{ const w=parseFloat(el.value); if(Number.isFinite(w)&&w>=.5&&w<=6){ S.style[el.dataset.sw].width=w; render(); } });
  document.querySelectorAll('select[data-sd]').forEach(el=>el.onchange=()=>{ S.style[el.dataset.sd].dash=el.value; render(); });
  // 축 배정
  buildAxisSelectors();
  document.getElementById('axis-section').style.display=(S.ymode==="다중 Y축")?"block":"none";
}

function buildAxisSelectors(){
  const g=document.getElementById('axis-group'); let html="";
  INDICATORS.forEach(ind=>{
    if(!S.show[ind.id]) return;
    if(S.axis[ind.id]===undefined) S.axis[ind.id]=AXIS_KEY_OF[AXIS_CHOICES[ind.axDefault]];
    const cur=S.axis[ind.id];
    html+=`<div class="sb-sub">${ind.axLabel}</div><select data-ax="${ind.id}">`+
      AXIS_CHOICES.map(c=>`<option value="${AXIS_KEY_OF[c]}"${AXIS_KEY_OF[c]===cur?' selected':''}>${c}</option>`).join("")+`</select>`;
  });
  g.innerHTML=html;
  g.querySelectorAll('select[data-ax]').forEach(el=>el.onchange=()=>{ S.axis[el.dataset.ax]=el.value;S.view={}; render(); });
}

function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function latestDate(){return DATA.nasdaq.dates.at(-1)||todayStr();}
function freshState(){const result=JSON.parse(JSON.stringify(DEFAULT_STATE));result.end=latestDate();result.start=periodStart(result.period,result.end);return result;}
function statusText(text){document.getElementById('save-status').textContent=text;}
function saveSettings(manual=false){
  if(!MacroSettings.validDate(S.start)||!MacroSettings.validDate(S.end)||S.start>S.end)return false;
  try{localStorage.setItem(MacroSettings.KEY,JSON.stringify(MacroSettings.encode(S)));statusText(manual?'설정을 저장했습니다':'마지막 설정 자동 저장됨');return true;}
  catch(error){statusText('브라우저 저장 불가 · 파일로 내보내세요');return false;}
}
function applySettings(state){
  Object.assign(S,state);
  if(S.dateMode==='rolling'){const end=latestDate();if(end!==S.end)S.view={};S.end=end;S.start=periodStart(S.period,end);}
}
function restoreSettings(){
  try{const raw=localStorage.getItem(MacroSettings.KEY);if(raw)applySettings(MacroSettings.decode(JSON.parse(raw),freshState()));}
  catch(error){statusText('저장 설정을 읽지 못해 기본값을 사용합니다');}
}
function bindSettings(){
  document.getElementById('save-settings').onclick=()=>saveSettings(true);
  document.getElementById('export-settings').onclick=()=>{
    try{
      const payload=MacroSettings.encode(S);MacroSettings.decode(payload,freshState());
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='Macro_Lens_settings_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);statusText('설정 파일을 내보냈습니다');
    }catch(error){statusText('유효한 날짜 범위를 선택한 후 내보내세요');}
  };
  const input=document.getElementById('settings-file');
  document.getElementById('import-settings').onclick=()=>input.click();
  input.onchange=async()=>{
    const file=input.files[0];if(!file)return;
    try{
      if(file.size>262144)throw new Error('설정 파일이 너무 큽니다 (최대 256KB).');
      const parsed=JSON.parse(await file.text());
      const state=MacroSettings.decode(parsed,freshState()); // validate entirely before mutating
      applySettings(state);buildUI();await render();saveSettings();statusText('설정 파일을 적용했습니다');
    }catch(error){statusText('불러오기 실패: '+error.message);}
    finally{input.value='';}
  };
  document.getElementById('reset-view').onclick=async()=>{applySettings(freshState());buildUI();await render();saveSettings(true);};
  window.addEventListener('pagehide',()=>saveSettings());
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveSettings();});
}
const HELP={
  dates:['날짜 범위','기간 버튼(1Y·10Y 등)은 최신 데이터 날짜를 기준으로 매번 같은 기간을 유지합니다. 날짜를 직접 입력하면 해당 시작일·종료일을 그대로 저장합니다. 확대·축 이동으로 변경한 보기 범위도 저장됩니다.'],
  settings:['설정 저장','기간, 차트 형태, 색상, 굵기, 선 종류, 지표 선택, 축 배정, 회귀 채널과 확대 범위를 자동 저장합니다. 다음 접속 때 같은 브라우저·사이트에서 복원합니다.\n\n파일 내보내기는 JSON 설정 파일을 다운로드합니다. 다른 폴더·PC·브라우저에서도 파일 불러오기로 복원할 수 있습니다. 이 파일에는 시세 데이터와 파일 경로가 포함되지 않습니다. 브라우저 데이터 삭제 또는 시크릿 모드 종료 시 자동 저장본은 사라질 수 있습니다.'],
  regression:['회귀 채널','선택 기간의 나스닥 종가에 회귀선을 맞추고 잔차 표준편차의 배수로 상·하단을 표시합니다. 로그 회귀는 양수 값에 적용합니다. 0 또는 음수가 포함된 수익률 모드는 선형 회귀로 처리합니다. 채널은 미래 가격 예측 또는 신뢰구간이 아닙니다.'],
  chart:['차트 조작','차트 안쪽에서 드래그하면 확대하고, 더블클릭하면 표시 범위를 초기화합니다. 좌우 축과 가장자리의 드래그 핸들은 비활성화했습니다. 커서 이동은 위쪽 값 표시줄만 갱신하며 축 범위나 차트 크기를 변경하지 않습니다.'],
  liquidity:['글로벌 유동성','Fed·ECB·BOJ 자산을 달러로 환산해 합산한 전년 대비 변화율입니다. 실제 관측 날짜에 표시하며 시간 시프트는 없습니다. MacroMicro의 Global Excess Liquidity 원 지표와 다른 근사치입니다.'],
  financial:['재무지표','PER·EPS·예상 PER·예상 EPS를 지수별로 구분합니다.\n\nS&P 500의 연도별 자료는 매년 1월 1일에 관측한 TTM 값으로, 연평균이나 해당 연도 결산 EPS가 아닙니다. EPS는 명목값입니다.\n\n나스닥은 나스닥 종합(^IXIC), 다우는 다우 산업평균(^DJI)입니다. Nasdaq-100·ETF·거래소 운영회사(NDAQ) 수치로 바꾸지 않습니다. 검증된 값이 없으면 미제공으로 표시합니다. 예상치는 과거 자료를 임의로 소급 생성하지 않습니다. 관측일·출처·기준은 각 항목의 ⓘ에서 확인하세요.'],
  sources:['데이터 출처','가격: Yahoo Finance / 보조 Stooq. 경제지표: FRED M2SL·FEDFUNDS·DGS10·DGS30·WALCL·ECBASSETSW·JPNASSETS·DEXUSEU·DEXJPUS.\n\n재무: Multpl 및 OfficialData의 S&P/Shiller 재게시 자료, 제공되는 경우 Yahoo Finance의 지수 재무 값. 최신 수집 날짜와 실제 지표 관측일은 다를 수 있습니다. 각 재무지표의 ⓘ에 출처와 날짜를 표시합니다.\n\n지수화는 시작값=100, 수익률은 시작 대비 증감률입니다. 금리·금리차의 증감률은 채권 투자수익률이 아닙니다.']
};
function bindHelp(){
  document.querySelectorAll('.info-btn').forEach(button=>button.title=button.getAttribute('aria-label')||'설명');
  const dialog=document.getElementById('info-dialog');
  document.getElementById('close-info').onclick=()=>dialog.close();
  dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
  document.addEventListener('click',event=>{
    const button=event.target.closest('[data-help],[data-fin-help]');if(!button)return;
    event.preventDefault();event.stopPropagation();
    let title,text,url='';
    if(button.dataset.finHelp){
      const ind=FIN_INDICATORS.find(x=>x.id===button.dataset.finHelp);if(!ind)return;
      const entry=DATA?.financials?.[ind.index+'_'+ind.metric];title=ind.label;
      text=entry?.dates?.length?`${entry.basis||''}\n\n관측 범위: ${entry.dates[0]} — ${entry.dates.at(-1)} (${entry.dates.length}개)\n마지막 값: ${fmt(entry.values.at(-1),2)} ${ind.unit}\n수집 시각: ${entry.retrieved_at||'미확인'}\n출처: ${entry.source||'미확인'}\n상태: ${entry.status==='stale'?'갱신 실패 · 이전 자료': '수집됨'}${entry.reason?'\n'+entry.reason:''}`:(entry?.reason||'검증된 공개 데이터가 없습니다.');
      url=entry?.source_url||'';
    }else{[title,text]=HELP[button.dataset.help]||['설명',''];}
    document.getElementById('info-title').textContent=title;document.getElementById('info-text').textContent=text;
    const link=document.getElementById('info-link');link.hidden=!/^https?:\/\//.test(url);if(!link.hidden)link.href=url;
    dialog.showModal();
  });
}

// ── 초기화 ────────────────────────────────────────────────────────────────
function initDates(){
  S.end = todayStr();
  S.start = periodStart(S.period, S.end);
}
async function boot(){
  // 햄버거
  const app=document.getElementById('app');
  const togglePanel=(open)=>{app.classList.toggle('open',open);document.getElementById('hamburger').setAttribute('aria-expanded',String(open));};
  document.getElementById('hamburger').onclick=()=>togglePanel(!app.classList.contains('open'));
  document.getElementById('overlay').onclick=()=>togglePanel(false);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')togglePanel(false);});
  bindSettings();
  bindHelp();
  try{
    const res=await fetch('data.json?ts='+Date.now());
    if(!res.ok) throw new Error('data.json 로드 실패 ('+res.status+')');
    DATA=await res.json();
  }catch(e){
    document.getElementById('status').innerHTML='<div class="status err">데이터를 불러오지 못했습니다: '+e.message+
      '<br>GitHub Actions가 data.json을 생성했는지 확인하세요.</div>';
    return;
  }
  initDates();
  // 데이터 범위로 end 보정
  if(DATA.nasdaq && DATA.nasdaq.dates.length){
    const lastD=DATA.nasdaq.dates[DATA.nasdaq.dates.length-1];
    if(lastD<S.end) S.end=lastD;
    S.start=periodStart(S.period,S.end);
  }
  restoreSettings();
  buildUI();
  await render();
  let resizeFrame;
  const scheduleResize=()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(resizeChart);};
  window.addEventListener('resize',scheduleResize);
  if(typeof ResizeObserver!=='undefined'){
    const observer=new ResizeObserver(scheduleResize);
    observer.observe(document.getElementById('chart-wrap'));

  }
}
boot().catch(error=>{document.getElementById('status').textContent='차트 실행 오류: '+error.message;});

</script>
